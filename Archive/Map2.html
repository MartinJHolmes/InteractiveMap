    <h1 id="page-title">Valencia</h1>

        <img id="mapPicture" />
        <div id="dot"></div>

    <textarea id="log" readonly placeholder="GPS messages will appear here..."></textarea>

    <!-- <script src="include/common.js"></script> -->
    <script type="module" src="./include/landmarks.js"></script>

    <!-- <script type="module" src="./include/main2.js"></script> -->
    <script type="module">
        import { Map } from "./include/Map2.js";
        const map = new Map();
        map.loadMapContents(0);

        const mapContainer = document.getElementById("mapContainer");

        mapContainer.addEventListener("contextmenu", (event) => {
            // Prevent the browser's normal right-click menu
            event.preventDefault();

            // Coordinates relative to the mapContainer
            const rect = mapContainer.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            console.log(map.mapDefinition.topLeft.lng);
            map.getCoordinate(x, y);
        });
    </script>


</body>

</html>
